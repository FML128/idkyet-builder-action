name: 'idkyet builder'
description: 'builder for the idkyet linux project'
inputs:
  layer_config_file:
    description: 'layer config file'
    required: true
  out_dir:
    description: 'out directory'
    required: true
  version:
    description: 'version for release'
    required: true
  registry_username:
    description: 'username for registry'
    required: true
  registry_password:
    description: 'password for registry'
    required: true
  registry_url:
    description: 'registry url (host) used for skopeo login and pushes'
    required: false
    default: 'git.fml128.ch'
  sb_db_key:
    description: 'secure_boot db key to sign efi'
    required: false
  sb_db_pem:
    description: 'secure_boot db pem to sign efi'
    required: false
  pcr_key:
    description: 'PEM private key that signs the PCR policy of UKIs for layers with boot.pcr_signing (passed as INPUT_PCR_KEY)'
    required: false
    default: ''
  api_auth_token:
    description: 'deprecated, unused: the builder never read it; kept so existing callers do not break'
    required: false
  gpg_sign_key:
    description: 'deprecated, unused: the builder never signed with it; kept so existing callers do not break'
    required: false
  dry_run:
    description: 'print the generated pipeline and exit without building or pushing'
    required: false
    default: 'false'
  only:
    description: 'build only the given layer id (and its internal ancestors)'
    required: false
    default: ''
  arch:
    description: 'build only the builds of this architecture (x86_64_v3, x86_64, x86_64_v4); empty builds every architecture a layer lists'
    required: false
    default: ''
  check_packages:
    description: 'run pacman/AUR package existence checks during validate'
    required: false
    default: 'false'
#outputs:
#  hashes:
#    description: 'json dict of hashes of all files'
runs:
  using: "composite"
  steps:
    - name: Validate
      uses: ./validate
      with:
        layer_config_file: ${{ inputs.layer_config_file }}
        check_packages: ${{ inputs.check_packages }}
    - name: Restore and build aur
      uses: ./aur
      with:
        layer_config_file: ${{ inputs.layer_config_file }}
    - name: Build images
      uses: ./builder
      with:
        layer_config_file: ${{ inputs.layer_config_file }}
        out_dir: ${{ inputs.out_dir }}
        registry_username: ${{ inputs.registry_username }}
        registry_password: ${{ inputs.registry_password }}
        registry_url: ${{ inputs.registry_url }}
        version: ${{ inputs.version }}
        sb_db_key: ${{ inputs.sb_db_key }}
        sb_db_pem: ${{ inputs.sb_db_pem }}
        pcr_key: ${{ inputs.pcr_key }}
        dry_run: ${{ inputs.dry_run }}
        only: ${{ inputs.only }}
        arch: ${{ inputs.arch }}

    - name: Upload Packages
      if: inputs.dry_run != 'true'
      env:
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        REGISTRY_URL: ${{ inputs.registry_url }}
        OUT_DIR: ${{ inputs.out_dir }}
        PACKAGE_OWNER: ${{ github.repository_owner }}
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Credentials stay in env and reach curl through a netrc on a pipe, so
        # they are neither part of the generated script nor visible in argv.
        netrc() { printf 'machine %s login %s password %s\n' "$REGISTRY_URL" "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD"; }
        case "$OUT_DIR" in
          /*) out="$OUT_DIR" ;;
          *) out="$GITHUB_WORKSPACE/$OUT_DIR" ;;
        esac
        base_url="https://${REGISTRY_URL}/api/packages/${PACKAGE_OWNER}/generic/${GITHUB_REPOSITORY#*/}/${PACKAGE_VERSION}"
        marker="${RUNNER_TEMP:-/tmp}/idkyet-upload-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
        cd "$out"
        for f in *; do
          echo "Uploading $f"
          du -sh "$f"
          # Only a run that started uploading may delete the version on failure.
          touch "$marker"
          curl --fail --netrc-file <(netrc) --upload-file "$f" "$base_url/$f"
        done
      shell: bash
    - name: If failure delete packages
      if: failure() && inputs.dry_run != 'true'
      env:
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        REGISTRY_URL: ${{ inputs.registry_url }}
        PACKAGE_OWNER: ${{ github.repository_owner }}
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        marker="${RUNNER_TEMP:-/tmp}/idkyet-upload-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
        if [ ! -e "$marker" ]; then
          echo "This run uploaded nothing; leaving package version ${PACKAGE_VERSION} untouched"
          exit 0
        fi
        netrc() { printf 'machine %s login %s password %s\n' "$REGISTRY_URL" "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD"; }
        curl --netrc-file <(netrc) -X DELETE \
          "https://${REGISTRY_URL}/api/packages/${PACKAGE_OWNER}/generic/${GITHUB_REPOSITORY#*/}/${PACKAGE_VERSION}" \
          || echo "warning: failed to delete partially uploaded package version ${PACKAGE_VERSION}"
      shell: bash
