name: 'idkyet builder'
description: 'builder for the idkyet linux project'
inputs:
  layer_config_file:
    description: 'layer config file'
    required: true
  out_dir:
    description: 'out directory'
    required: true
  version:
    description: 'version for release'
    required: true
  registry_username:
    description: 'username for registry'
    required: true
  registry_password:
    description: 'password for registry'
    required: true
  registry_url:
    description: 'registry url (host) used for skopeo login and pushes'
    required: false
    default: 'git.fml128.ch'
  sb_db_key:
    description: 'secure_boot db key to sign efi'
    required: false
  sb_db_pem:
    description: 'secure_boot db pem to sign efi'
    required: false
  pcr_key:
    description: 'PEM private key that signs the PCR policy of UKIs for layers with boot.pcr_signing (passed as INPUT_PCR_KEY)'
    required: false
    default: ''
  api_auth_token:
    description: 'deprecated, unused: the builder never read it; kept so existing callers do not break'
    required: false
  gpg_sign_key:
    description: 'deprecated, unused: the builder never signed with it; kept so existing callers do not break'
    required: false
  dry_run:
    description: 'print the generated pipeline and exit without building or pushing'
    required: false
    default: 'false'
  only:
    description: 'build only the given layer id (and its internal ancestors)'
    required: false
    default: ''
  arch:
    description: 'build only the builds of this architecture (x86_64_v3, x86_64, x86_64_v4; passed as --arch); empty builds every architecture a layer lists'
    required: false
    default: ''

#outputs:
#  hashes:
#    description: 'json dict of hashes of all files'
runs:
  using: "composite"
  steps:
    - name: Build image
      uses: docker://git.fml128.ch/fml128/idkyet-builder:2026.11.092230@sha256:946872590b0bbd982dbd512fe14978c3534ccc70c2a81aa814e5c783c8b739eb
      with:
        args: build ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }} ${{ inputs.arch != '' && format('--arch {0}', inputs.arch) || '' }} ${{ inputs.layer_config_file }}
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OUT_DIR: ${{ inputs.out_dir }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registry_username }}
        INPUT_REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        INPUT_REGISTRY_URL: ${{ inputs.registry_url }}
        INPUT_SB_DB_KEY: ${{ inputs.sb_db_key }}
        INPUT_SB_DB_PEM: ${{ inputs.sb_db_pem }}
        INPUT_PCR_KEY: ${{ inputs.pcr_key }}
